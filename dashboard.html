<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ML Model Profiling Dashboard</title>
  <style>
    :root {
      --bg: #FDF6EC;
      --card: #F5EDE1;
      --card-border: #EDE3D4;
      --text: #36454F;
      --muted: #7A8A8E;
      --high: #6B2D5B;
      --high-bg: #F0E0EA;
      --high-text: #6B2D5B;
      --medium: #C04000;
      --medium-bg: #F8E8DD;
      --medium-text: #C04000;
      --low: #D4918B;
      --low-bg: #F5E8E6;
      --low-text: #8B4049;
      --accent: #6B2D5B;
      --ref: #6B2D5B;
      --prac: #C04000;
      --held: #D4918B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      background: linear-gradient(135deg, #6B2D5B, #C04000);
      border-bottom: 1px solid var(--card-border);
    }
    header h1 { font-size: 24px; margin-bottom: 4px; color: #FDF6EC; }
    header p { color: #F0E0EA; font-size: 14px; }
    .stats-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 32px;
      border-bottom: 1px solid var(--card-border);
      background: var(--card);
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 18px;
      min-width: 120px;
      text-align: center;
    }
    .stat .value { font-size: 22px; font-weight: 700; }
    .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding: 16px 32px;
      border-bottom: 1px solid var(--card-border);
    }
    .controls select, .controls button {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .controls button.active { background: var(--accent); color: #FDF6EC; font-weight: 600; border-color: var(--accent); }
    .controls label { font-size: 13px; color: var(--muted); }
    main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
    .pool-section { margin-bottom: 32px; }
    .pool-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .pool-header h2 { font-size: 18px; }
    .pool-badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
    }
    .pool-ref .pool-badge { background: var(--ref); }
    .pool-prac .pool-badge { background: var(--prac); }
    .pool-held .pool-badge { background: var(--held); }
    .pool-meta { font-size: 12px; color: var(--muted); }
    .model-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .model-card .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .model-id {
      font-size: 18px;
      font-weight: 700;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      color: var(--accent);
    }
    .model-task { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .model-tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--card-border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      vertical-align: middle;
    }
    .conf {
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
    }
    .conf.high { background: var(--high-bg); color: var(--high-text); }
    .conf.medium { background: var(--medium-bg); color: var(--medium-text); }
    .conf.low { background: var(--low-bg); color: var(--low-text); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }
    .metric {
      background: var(--card-border);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .metric .m-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .metric .m-value { font-size: 15px; font-weight: 600; margin-top: 3px; }
    .meter {
      height: 8px;
      background: var(--card-border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .meter > div { height: 100%; background: var(--accent); border-radius: 999px; }
    .weakness-list { margin-top: 12px; }
    .weakness-list h5 { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .weakness {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--medium);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      margin: 0 6px 6px 0;
    }
    .weakness.sev-high { border-left-color: var(--low); }
    .weakness.sev-medium { border-left-color: #C04000; }
    .weakness.sev-low { border-left-color: var(--high); }
    .no-weakness { font-size: 12px; color: var(--muted); font-style: italic; }
    .evidence { margin-top: 12px; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--card-border); padding-top: 10px; }
    .evidence span { margin-right: 14px; }
    .warn-scalemismatch { color: var(--medium); font-weight: 600; }
    .overview {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 24px;
    }
    .overview h3 { font-size: 16px; margin-bottom: 12px; color: var(--text); }
    .overview .ov-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .ov-family {
      background: var(--card-border);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 180px;
      flex: 1;
    }
    .ov-family .f-name { font-size: 12px; color: var(--muted); }
    .ov-family .f-count { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .hidden { display: none; }
    .link-accent { color: var(--accent); }
    .sort-label { margin-left: 16px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; border-top: 1px solid var(--card-border); }
    .empty-state { text-align: center; color: var(--muted); padding: 40px; font-size: 15px; }
    .surprise-section {
      background: var(--card);
      border: 1px solid #6B2D5B;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .surprise-section h3 { font-size: 18px; margin-bottom: 14px; color: #6B2D5B; }
    .surprise-verdict {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 14px;
    }
    .surprise-verdict.different { background: var(--low-bg); color: var(--low-text); }
    .surprise-verdict.same { background: var(--high-bg); color: var(--high-text); }
    .surprise-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .surprise-metric {
      background: var(--card-border);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .surprise-metric .m-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .surprise-metric .m-value { font-size: 15px; font-weight: 600; margin-top: 3px; }
    .surprise-trigger {
      background: var(--card-border);
      border: 1px solid #6B2D5B;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 14px;
      font-size: 13px;
    }
    .surprise-trigger h5 { color: #6B2D5B; margin-bottom: 8px; }
    .surprise-trigger table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .surprise-trigger th, .surprise-trigger td { padding: 6px 10px; border: 1px solid var(--card-border); text-align: center; }
    .surprise-trigger th { background: var(--card); color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .surprise-trigger td.diverge { background: #D4918B; color: #6B2D5B; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1> ML Model Profiling Dashboard</h1>
    <p>13 undocumented models profiled through black-box API probing
       · <span id="generatedAtLine">last updated unknown</span></p>


  <div class="stats-bar" id="statsBar"></div>

  <div class="controls">
    <label>Pool:</label>
    <button data-filter="all" class="active">All</button>
    <button data-filter="reference">Reference</button>
    <button data-filter="practice">Practice</button>
    <button data-filter="held_out">Held-Out</button>
    <button data-filter="surprise1">Surprise 1</button>
    <button data-filter="surprise2">Surprise 2</button>
    <label class="sort-label">Sort by:</label>
    <select id="sortSelect" aria-label="Sort by">
      <option value="pool">Pool (default)</option>
      <option value="confidence-desc">Confidence (high → low)</option>
      <option value="confidence-asc">Confidence (low → high)</option>
      <option value="agreement-desc">Agreement (high → low)</option>
      <option value="probes-desc">Probes used (high → low)</option>
    </select>
  </div>
  </header>

  <main id="main"></main>

  <footer>Evidence-backed profiling · Confidence reflects probe investment · Honest uncertainty over speculation ·
  </footer>

  <script>
    const POOL_ORDER = { reference: 0, practice: 1, held_out: 2 };
    const POOL_LABEL = { reference: "Reference", practice: "Practice", held_out: "Held-Out" };
    const MODEL_DISPLAY_NAMES = {
      ref_01: "MNIST Digits 10-Class",
      ref_02: "Wine Classification 3-Class",
      ref_03: "Breast Cancer Binary",
      ref_04: "Diabetes Progression Regression",
      prac_01: "Wine Classification 3-Class (Practice)",
      prac_02: "Diabetes Progression Regression (Practice)",
      prac_03: "MNIST Digits 10-Class (Practice)",
      prac_04: "Breast Cancer Binary (Practice)",
      held_01: "Wine Classification 3-Class (Held-Out)",
      held_02: "MNIST Digits 10-Class (Held-Out)",
      held_03: "Diabetes Progression Regression (Held-Out)",
      held_04: "Breast Cancer Binary (Held-Out)",
      held_05: "MNIST Digits 10-Class (Held-Out)",
    };

    let allProfiles = [];
    let surprise1Data = null;
    let surprise2Data = null;
    let generatedAt = null;

    function loadProfiles() {
      return fetch('data/profiles.json')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
          if (Array.isArray(data)) return data;               // legacy flat list
          generatedAt = data.generated_at || null;
          return data.profiles || [];
        });
    }

    function confClass(c) {
      if (c >= 0.8) return 'high';
      if (c >= 0.6) return 'medium';
      return 'low';
    }

    function profileStats(profiles) {
      const total = profiles.length;
      const avgConf = profiles.reduce((s, p) => s + p.task_confidence, 0) / (total || 1);
      const totalUsed = profiles.reduce((s, p) => s + (p.probe_utilization?.used ?? 0), 0);
      const totalBudget = profiles.reduce((s, p) => s + (p.probe_utilization?.budget ?? 0), 0);
      const high = profiles.filter(p => p.task_confidence >= 0.8).length;
      const low = profiles.filter(p => p.task_confidence < 0.6).length;
      return { total, avgConf, totalUsed, totalBudget, high, low };
    }

    function renderStats(profiles) {
      const s = profileStats(profiles);
      const pct = s.totalBudget ? ((s.totalUsed / s.totalBudget) * 100).toFixed(1) : "0";
      const remaining = Math.max(0, s.totalBudget - s.totalUsed);
      document.getElementById('statsBar').innerHTML = `
        <div class="stat"><div class="value">${s.total}</div><div class="label">Models</div></div>
        <div class="stat"><div class="value">${(s.avgConf * 100).toFixed(0)}%</div><div class="label">Avg Confidence</div></div>
        <div class="stat"><div class="value">${s.high}</div><div class="label">High Conf (&ge;80%)</div></div>
        <div class="stat"><div class="value">${s.low}</div><div class="label">Low Conf (&lt;60%)</div></div>
        <div class="stat"><div class="value">${s.totalUsed}/${s.totalBudget}</div><div class="label">Probes Used (${pct}%)</div></div>
        <div class="stat"><div class="value">${remaining.toLocaleString()}</div><div class="label">Probes Remaining</div></div>
      `;
    }

    function renderWeaknesses(p) {
      if (!p.weaknesses || p.weaknesses.length === 0) {
        return '<p class="no-weakness">No significant weaknesses detected</p>';
      }
      return p.weaknesses.map(w => {
        const sev = w.severity || 'medium';
        return `<span class="weakness sev-${sev}"><b>${w.type.replace(/_/g, ' ')}:</b> ${w.description}</span>`;
      }).join('');
    }

    function renderEvidence(p) {
      const ev = p.evidence || {};
      const ot = p.output_type || {};
      const parts = [];
      parts.push(`<span>🔍 Shape match: ${ev.shape_match ? 'yes' : 'no'}</span>`);
      if (ev.type_consistent !== undefined) {
        parts.push(`<span>🧬 Type consistent: ${ev.type_consistent === null ? 'unknown' : (ev.type_consistent ? 'yes' : 'no')}</span>`);
      }
      if (ot.classification !== undefined && ot.classification !== null) {
        const n = ot.n_classes ? ` (${ot.n_classes}-class)` : '';
        parts.push(`<span>🎯 Output: ${ot.classification ? 'classification' + n : 'regression'}</span>`);
      }
      if (p.correlation !== undefined && p.correlation !== null) {
        parts.push(`<span>📈 corr=${p.correlation}</span>`);
      }
      if (p.reference_accuracy != null) {
        parts.push(`<span>🎯 Ref accuracy: ${(p.reference_accuracy * 100).toFixed(0)}%</span>`);
      }
      if (p.est_accuracy_range) {
        parts.push(`<span>🎯 Est. acc: ${(p.est_accuracy_range.best * 100).toFixed(0)}% [${(p.est_accuracy_range.lower * 100).toFixed(0)}–${(p.est_accuracy_range.upper * 100).toFixed(0)}%]</span>`);
      }
      if (ev.agreement_half1 != null && ev.agreement_half2 != null) {
        parts.push(`<span>🧪 Agreement stability: ${(ev.agreement_half1 * 100).toFixed(0)}% → ${(ev.agreement_half2 * 100).toFixed(0)}%</span>`);
      }
      if (ev.disagreement_examples && ev.disagreement_examples.length) {
        parts.push(`<span>💥 Disagree (unknown≠ref): ${ev.disagreement_examples.slice(0,5).map(d => `${d.unknown}≠${d.reference}`).join(', ')}${ev.disagreement_examples.length > 5 ? ', …' : ''}</span>`);
      }
      if (ev.scale_mismatch) {
        parts.push(`<span class="warn-scalemismatch">⚠️ Scale mismatch vs reference</span>`);
      }
      if (ev.degenerate) {
        parts.push(`<span class="warn-scalemismatch">♻️ Degenerate output (single class seen)</span>`);
      }
      if (ev.coverage_collapse) {
        parts.push(`<span class="warn-scalemismatch">🌑 Collapsed class coverage</span>`);
      }
      parts.push(`<span>🧪 Comparison probes: ${ev.comparison_probes || 0}</span>`);
      parts.push(`<span>⚡ Edge case tests: ${ev.edge_case_tests || 0}</span>`);
      if (p.class_coverage && p.class_coverage.observed && p.class_coverage.observed.length) {
        parts.push(`<span>🎲 Classes seen: ${p.class_coverage.distinct_classes} (${p.class_coverage.observed.join(',')})</span>`);
      }
      parts.push(`<span>📍 Pool: ${POOL_LABEL[p.pool_set] || p.pool_set}</span>`);
      return `<div class="evidence">${parts.join('')}</div>`;
    }

    function confBreakdown(p) {
      // Mirrors calculate_confidence() so reviewers can audit any number.
      const ev = p.evidence || {};
      const ot = p.output_type || {};
      const cov = p.class_coverage || {};
      const expCls = ({ 'mnist_digits_10class': 10, 'wine_classification_3class': 3, 'breast_cancer_binary': 2 })[p.inferred_task] || ot.n_classes || 10;
      let add = [];
      let sub = [];
      if (ev.shape_match && ev.type_consistent !== false) add.push('+0.20 type/shape');
      else if (ev.shape_match && ev.type_consistent === null) add.push('+0.10 type/shape');
      const covOk = cov.observed && cov.observed.length && cov.distinct_classes >= Math.max(2, Math.round(0.5 * expCls));
      if (covOk) add.push('+0.10 coverage');
      const a = p.agreement_with_reference;
      if (a != null) {
        if (a > 0.90) add.push('+0.45 agreement');
        else if (a > 0.80) add.push('+0.36 agreement');
        else if (a > 0.70) add.push('+0.25 agreement');
      }
      add.push(`+${(0.15 * Math.min(1, (ev.comparison_probes || 0) / 200)).toFixed(2)} probes`);
      if (ev.scale_mismatch) sub.push('−0.10 scale mismatch');
      if (ev.degenerate) sub.push('−0.15 degenerate');
      if (ev.coverage_collapse) sub.push('−0.10 collapsed coverage');
      if ((p.weaknesses || []).some(w => w.severity === 'high')) sub.push('−0.05 high weakness');
      let s = ev.shape_match && ev.type_consistent !== false ? 0.20 : (ev.shape_match && ev.type_consistent === null ? 0.10 : 0);
      if (covOk) s += 0.10;
      if (a != null) { if (a > 0.90) s += 0.45; else if (a > 0.80) s += 0.36; else if (a > 0.70) s += 0.25; }
      s += 0.15 * Math.min(1, (ev.comparison_probes || 0) / 200);
      if (ev.scale_mismatch) s = Math.max(0, s - 0.10);
      if (ev.degenerate) s = Math.max(0.10, s - 0.15);
      if (ev.coverage_collapse) s = Math.max(0.10, s - 0.10);
      if ((p.weaknesses || []).some(w => w.severity === 'high')) s = Math.max(0, s - 0.05);
      const text = [...add, ...sub].join(' · ') || 'no evidence yet';
      return { text, computed: s };
    }

    function renderCard(p) {
      const confCls = confClass(p.task_confidence);
      const used = p.probe_utilization?.used ?? 0;
      const budget = p.probe_utilization?.budget ?? 0;
      const pct = budget ? Math.round((used / budget) * 100) : 0;
      const ev = p.evidence || {};
      const ot = p.output_type || {};
      const breakdown = confBreakdown(p);
      return `
        <div class="model-card">
          <div class="top-row">
            <div>
              <div class="model-id">${MODEL_DISPLAY_NAMES[p.model_id] || p.model_id}<span class="model-tag">${p.model_id}</span></div>
              <div class="model-task">${(p.inferred_task || 'unknown').replace(/_/g, ' ')}</div>
            </div>
            <span class="conf ${confCls}">${Math.round(p.task_confidence * 100)}%</span>
          </div>
          <div class="meter" style="margin-top:10px;background:var(--card-border);"><div style="width:${Math.min(100, p.task_confidence * 100)}%;background:${p.task_confidence >= 0.8 ? 'var(--high)' : p.task_confidence >= 0.6 ? 'var(--medium)' : 'var(--low)'};"></div></div>
          <div class="grid">
            <div class="metric">
              <div class="m-label">Performance</div>
              <div class="m-value">${p.estimated_performance || 'Unknown'}</div>
            </div>
            <div class="metric">
              <div class="m-label">Est. Accuracy</div>
              <div class="m-value">${p.est_accuracy_range ? (p.est_accuracy_range.best * 100).toFixed(0) + '%' : '—'}</div>
              <div class="m-label" style="font-size:10px;">${p.est_accuracy_range ? 'range ' + (p.est_accuracy_range.lower * 100).toFixed(0) + '–' + (p.est_accuracy_range.upper * 100).toFixed(0) + '%' : ''}</div>
            </div>
            <div class="metric">
              <div class="m-label">Agreement w/ Reference</div>
              <div class="m-value">${p.agreement_with_reference !== undefined && p.agreement_with_reference !== null ? (p.agreement_with_reference * 100).toFixed(0) + '%' : '—'}</div>
            </div>
            <div class="metric">
              <div class="m-label">Output Type</div>
              <div class="m-value">${ot.classification === null || ot.classification === undefined ? 'unknown' : (ot.classification ? (ot.n_classes ? ot.n_classes + '-class classifier' : 'classifier') : 'regression')}</div>
            </div>
            <div class="metric">
              <div class="m-label">Probe Budget Used</div>
              <div class="m-value">${used}/${budget} (${pct}%)</div>
              <div class="meter"><div style="width:${Math.min(100, pct)}%"></div></div>
            </div>
          </div>
          <div class="evidence" style="border-top:none;padding-top:6px;font-size:11px;color:var(--muted);">
            Confidence = ${breakdown.text}
          </div>
          <div class="weakness-list">
            <h5>Weaknesses / Edge Cases</h5>
            ${renderWeaknesses(p)}
          </div>
          ${renderEvidence(p)}
        </div>
      `;
    }

    function renderOverview(profiles) {
      const byFamily = {};
      profiles.forEach(p => {
        const task = p.inferred_task || 'unknown';
        byFamily[task] = (byFamily[task] || 0) + 1;
      });
      const entries = Object.entries(byFamily).sort((a, b) => b[1] - a[1]);
      return `
        <div class="overview">
          <h3>📊 Model Composition</h3>
          <div class="ov-grid">
            ${entries.map(([task, count]) => `
              <div class="ov-family">
                <div class="f-name">${task.replace(/_/g, ' ')}</div>
                <div class="f-count">${count} model${count > 1 ? 's' : ''}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function render(profiles) {
      const active = document.querySelector('.controls button.active').dataset.filter;
      const main = document.getElementById('main');

      if (active === 'surprise1') {
        document.getElementById('statsBar').innerHTML = '';
        main.innerHTML = surprise1Data ? renderSurpriseChallenge(surprise1Data) : '<div class="empty-state">Surprise 1 data not available.</div>';
        return;
      }
      if (active === 'surprise2') {
        document.getElementById('statsBar').innerHTML = '';
        main.innerHTML = surprise2Data ? renderSurpriseChallenge2(surprise2Data) : '<div class="empty-state">Surprise 2 data not available.</div>';
        return;
      }

      let filtered = profiles;
      if (active !== 'all') {
        filtered = profiles.filter(p => p.pool_set === active);
      }
      renderStats(filtered);

      const sortBy = document.getElementById('sortSelect').value;
      const sorted = [...filtered];
      switch (sortBy) {
        case 'confidence-desc': sorted.sort((a, b) => b.task_confidence - a.task_confidence); break;
        case 'confidence-asc': sorted.sort((a, b) => a.task_confidence - b.task_confidence); break;
        case 'agreement-desc': sorted.sort((a, b) => (b.agreement_with_reference||0) - (a.agreement_with_reference||0)); break;
        case 'probes-desc': sorted.sort((a, b) => (b.probe_utilization?.used ?? 0) - (a.probe_utilization?.used ?? 0)); break;
        case 'pool':
        default:
          sorted.sort((a, b) =>
            (POOL_ORDER[a.pool_set] ?? 9) - (POOL_ORDER[b.pool_set] ?? 9) ||
            a.model_id.localeCompare(b.model_id)
          );
      }

      if (sorted.length === 0) {
        main.innerHTML = '<div class="empty-state">No models in this pool yet.</div>';
        return;
      }

      if (sortBy === 'pool' || active === 'all') {
        let html = '';
        let currentPool = null;
        for (const p of sorted) {
          if (p.pool_set !== currentPool) {
            if (currentPool !== null) html += '</div>';
            currentPool = p.pool_set;
            const count = sorted.filter(x => x.pool_set === currentPool).length;
            const poolCls = currentPool === 'reference' ? 'ref' : currentPool === 'practice' ? 'prac' : 'held';
            html += `
              <div class="pool-section pool-${poolCls}">
                <div class="pool-header">
                  <h2>${POOL_LABEL[currentPool]}</h2>
                  <span class="pool-badge">${POOL_LABEL[currentPool]}</span>
                  <span class="pool-meta">${count} model${count > 1 ? 's' : ''}</span>
                </div>
            `;
          }
          html += renderCard(p);
        }
        if (currentPool !== null) html += '</div>';
        if (active === 'all') {
          let surpriseHtml = '';
          if (surprise1Data) surpriseHtml += renderSurpriseChallenge(surprise1Data);
          if (surprise2Data) surpriseHtml += renderSurpriseChallenge2(surprise2Data);
          html = surpriseHtml + renderOverview(sorted) + html;
        }
        main.innerHTML = html;
      } else {
        main.innerHTML = sorted.map(renderCard).join('');
      }
    }

    function renderSurpriseChallenge(data) {
      if (!data) return '';
      const v = data.verdict || 'unknown';
      const verdictCls = v === 'different' ? 'different' : 'same';
      const e = data.evidence || {};
      const t = data.trigger || {};
      const f0Band = t.divergence_band || {};
      const exampleRows = (t.example_inputs || []).map(ex => {
        const inputPreview = (ex.input || []).slice(0, 4).map(v => Math.round(v * 10) / 10).join(', ');
        const aProb = ex.model_A_probs ? Math.max(...ex.model_A_probs).toFixed(3) : '—';
        const bProb = ex.model_B_probs ? Math.max(...ex.model_B_probs).toFixed(3) : '—';
        return `<tr>
          <td title="${JSON.stringify(ex.input)}">${inputPreview}...</td>
          <td>${ex.model_A_prediction} (${aProb})</td>
          <td>${ex.model_B_prediction} (${bProb})</td>
        </tr>`;
      }).join('');

      return `
        <div class="surprise-section">
          <h3>Surprise Challenge 1 — Spot the Difference</h3>
          <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">
            Models: <code style="color:var(--accent)">${data.models?.A || 's1_model_a'}</code> vs
            <code style="color:var(--accent)">${data.models?.B || 's1_model_b'}</code> ·
            Task: ${data.task_family || 'unknown'} (${data.n_features} features)
          </div>
          <div class="surprise-verdict ${verdictCls}">${v.toUpperCase()} (confidence ${data.confidence || '—'})</div>
          <div class="surprise-grid">
            <div class="surprise-metric">
              <div class="m-label">Label Agreement</div>
              <div class="m-value">${e.label_agreement != null ? (e.label_agreement * 100).toFixed(1) + '%' : '—'}</div>
            </div>
            <div class="surprise-metric">
              <div class="m-label">Strict Agreement (label + probs)</div>
              <div class="m-value">${e.strict_agreement_labels_and_probs != null ? (e.strict_agreement_labels_and_probs * 100).toFixed(1) + '%' : '—'}</div>
            </div>
            <div class="surprise-metric">
              <div class="m-label">Label Flips</div>
              <div class="m-value">${e.label_flips_count ?? '—'}</div>
            </div>
            <div class="surprise-metric">
              <div class="m-label">Prob-only Disagreements</div>
              <div class="m-value">${e.prob_only_disagreement_count ?? '—'}</div>
            </div>
            <div class="surprise-metric">
              <div class="m-label">Probes / Model</div>
              <div class="m-value">${e.probes_used_per_model ?? '—'} / ${e.budget_per_model ?? '—'}</div>
            </div>
          </div>
          ${t.kind ? `
          <div class="surprise-trigger">
            <h5>Exact Trigger</h5>
            <p style="margin:4px 0;">${t.meaning || t.kind}</p>
            ${f0Band.min != null ? `
            <table>
              <thead><tr><th>Feature 0 range</th><th>Model A</th><th>Model B</th><th>Result</th></tr></thead>
              <tbody>
                <tr><td>≤ ${t.A_class0_boundary != null ? (t.A_class0_boundary - 0.5) : '?'}</td><td>class 1</td><td>class 1</td><td>agree</td></tr>
                <tr class="diverge-row"><td>${f0Band.min} – ${f0Band.max}</td><td>class 0</td><td>class 1</td><td class="diverge">DIVERGE</td></tr>
                <tr><td>≥ ${t.B_class0_boundary != null ? t.B_class0_boundary : '?'}</td><td>class 0</td><td>class 0</td><td>agree</td></tr>
              </tbody>
            </table>` : ''}
            ${exampleRows ? `
            <h5 style="margin-top:12px;">Example Disagreements</h5>
            <table>
              <thead><tr><th>Input (first 4 features)</th><th>Model A</th><th>Model B</th></tr></thead>
              <tbody>${exampleRows}</tbody>
            </table>` : ''}
          </div>` : ''}
          ${data.finding ? `<p style="margin-top:14px;font-size:13px;color:var(--text);font-style:italic;">"${data.finding}"</p>` : ''}
        </div>
      `;
    }

    function renderSurpriseChallenge2(data) {
      if (!data) return '';
      const cc = data.confidence_change || {};
      const bc = data.before_cut || {};
      const ac = data.after_cut || {};
      const dropped = cc.decreased;
      const arrow = dropped ? '↓' : '→';
      const arrowColor = dropped ? 'var(--low)' : 'var(--high)';

      return `
        <div class="surprise-section" style="border-color:#D4918B;">
          <h3 style="color:#D4918B;">Surprise Challenge 2 — Confidence Should Match Evidence</h3>
          <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">
            Model: <code style="color:var(--accent)">${data.model_id || 'prac_01'}</code> ·
            Task: ${data.model_task || 'unknown'} (${data.model_features} features)
          </div>
          <div style="font-size:13px;color:var(--text);margin-bottom:14px;font-style:italic;">
            "${data.key_principle || 'Confidence should match the amount of evidence available.'}"
          </div>
          <div class="surprise-grid" style="grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;">
            <div class="surprise-metric" style="border-color:#D4918B;">
              <div class="m-label">Before Cut</div>
              <div class="m-value" style="color:#D4918B;">${bc.confidence != null ? (bc.confidence * 100).toFixed(1) + '%' : '—'}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px;">
                ${bc.probes_used ?? '—'} probes · agreement ${bc.agreement != null ? (bc.agreement * 100).toFixed(1) + '%' : '—'}
              </div>
            </div>
            <div style="text-align:center;">
              <div style="font-size:28px;color:${arrowColor};font-weight:700;">${arrow}</div>
              <div style="font-size:12px;color:var(--muted);">−${(cc.drop_pct ?? 0).toFixed(1)}%</div>
            </div>
            <div class="surprise-metric" style="border-color:#D4918B;">
              <div class="m-label">After Cut</div>
              <div class="m-value" style="color:#D4918B;">${ac.confidence != null ? (ac.confidence * 100).toFixed(1) + '%' : '—'}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:4px;">
                ${ac.probes_used ?? '—'} probes · agreement ${ac.agreement != null ? (ac.agreement * 100).toFixed(1) + '%' : '—'}
              </div>
            </div>
          </div>
          <div style="margin-top:12px;font-size:12px;color:var(--muted);">
            <b>Key observation:</b> Agreement rate stays the same (${bc.agreement != null ? (bc.agreement * 100).toFixed(1) + '%' : '—'}) —
            only the probe count changed. The system honestly reports lower confidence with less evidence.
          </div>
          ${data.explanation ? `<p style="margin-top:10px;font-size:12px;color:var(--text);font-style:italic;">${data.explanation}</p>` : ''}
        </div>
      `;
    }

    function init() {
      document.querySelectorAll('.controls button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          render(allProfiles);
        });
      });
      document.getElementById('sortSelect').addEventListener('change', () => render(allProfiles));

      Promise.all([
        loadProfiles(),
fetch('data/surprise1_answer.json').then(r => r.ok ? r.json() : null).catch(() => null),
       fetch('data/surprise2_answer.json').then(r => r.ok ? r.json() : null).catch(() => null)
      ])
        .then(([profiles, s1, s2]) => {
          allProfiles = profiles;
          surprise1Data = s1;
          surprise2Data = s2;
          if (generatedAt) {
            const el = document.getElementById('generatedAtLine');
            el.textContent = 'last updated ' + generatedAt.replace('T', ' ').replace('Z', ' UTC');
          }
          render(profiles);
        })
        .catch(err => {
          document.getElementById('main').innerHTML =
            `<div class="empty-state">⚠️ Failed to load data/profiles.json — ${err.message}<br><br>Run the profiler to generate this file.</div>`;
        });
    }

    init();
  </script>
</body>
</html>
